# Build and test pull requests and the main branch with Node 22.

name: CI

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Check generated parser
        run: git diff --exit-code -- src/grammar.js
      - run: yarn test --runInBand
      - run: yarn test:exports
      - run: yarn test:types
      - run: yarn test:package
